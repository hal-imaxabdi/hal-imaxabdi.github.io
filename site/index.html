<script>
/* set the theme before first paint: saved choice, else the visitor's system setting */
try{var t=localStorage.getItem("theme");if(t!=="light"&&t!=="dark"){t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"}
document.documentElement.dataset.theme=t;if(t==="light")document.querySelector('meta[name="theme-color"]').setAttribute("content","#ffffff")}catch(e){}
</script>

</head>
