<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- soft blue light behind the glass -->
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <clipPath id="tile"><rect width="64" height="64" rx="15"/></clipPath>
    <!-- frosted glass: brighter at the top-left, almost clear at the bottom-right -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#d6ecff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".1"/>
    </linearGradient>
    <!-- the glass edge catches light on one side and fades on the other -->
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#d6ecff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8fc1ff" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#tile)">
    <!-- dark tile with blurred blue lights glowing behind the glass -->
    <rect width="64" height="64" fill="#06102a"/>
    <circle cx="16" cy="16" r="15" fill="#1f6bff" filter="url(#blur)"/>
    <circle cx="50" cy="48" r="16" fill="#5aa2ff" filter="url(#blur)"/>
    <circle cx="44" cy="12" r="8" fill="#0c3fb8" filter="url(#blur)"/>
  </g>

  <!-- the H as a pane of frosted glass -->
  <path d="M16 13h10v14h12V13h10v38H38V36H26v15H16z" fill="#1f6bff" opacity=".35" filter="url(#soft)"/>
  <path d="M16 13h10v14h12V13h10v38H38V36H26v15H16z" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- light streaks on the glass -->
  <path d="M18 15.5h6v6c-2 .5-4 1.5-6 3z" fill="url(#shine)" opacity=".8"/>
  <path d="M40 15.5h6v6c-2 .5-4 1.5-6 3z" fill="url(#shine)" opacity=".8"/>

  <!-- the tile's own thin glass rim -->
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#8fc1ff" stroke-opacity=".45" stroke-width="1.5"/>
</svg>
