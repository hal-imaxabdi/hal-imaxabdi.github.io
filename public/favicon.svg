<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A clear glass "H" with no background: see-through blue glass, a deeper blue outer edge
       (so it reads on light tabs), a bright inner rim and a shine (so it reads on dark tabs). -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fc1ff" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#3a7fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#1f6bff" stop-opacity=".65"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#d6ecff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="h"><path d="M12 8h14v17h12V8h14v48H38V39H26v17H12z"/></clipPath>
  </defs>

  <!-- outer edge in deep blue -->
  <path d="M12 8h14v17h12V8h14v48H38V39H26v17H12z" fill="url(#body)" stroke="#1f6bff" stroke-width="2.5" stroke-linejoin="round"/>

  <g clip-path="url(#h)">
    <!-- a soft darker band through the middle, like light bending in thick glass -->
    <path d="M0 44L64 30v12L0 56z" fill="#0c3fb8" opacity=".25"/>
    <!-- diagonal shine sweeping across the glass -->
    <path d="M0 0h40L0 34z" fill="url(#shine)" opacity=".55"/>
    <!-- bright inner rim -->
    <path d="M12 8h14v17h12V8h14v48H38V39H26v17H12z" fill="none" stroke="url(#rim)" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- small specular glints on the top edges -->
  <path d="M15 11.5h7" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <path d="M41 11.5h7" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
</svg>
